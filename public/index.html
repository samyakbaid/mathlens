<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathLens: see the math move</title>
    <meta name="description" content="Learn math one step at a time, with pictures that move as you go. Ask a tutor about any idea or paper, and graph anything in 2D or 3D." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231c1a16'/><circle cx='14' cy='14' r='8' fill='none' stroke='%23fffdf8' stroke-width='2.4'/><path d='M8.5 15.5c2-4.5 3.8-4.5 5.5 0s3.5 4.5 5.5 0' fill='none' stroke='%23f2c94c' stroke-width='2.2' stroke-linecap='round'/><path d='m20 20 6 6' stroke='%23fffdf8' stroke-width='2.8' stroke-linecap='round'/></svg>" />

    <!-- Apply the saved theme before anything paints, so dark mode doesn't flash white. -->
    <script>
      try {
        if (localStorage.getItem('mathlens-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>

    <!-- Typefaces: Fraunces (headings), IBM Plex Sans (text), IBM Plex Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />

    <!-- Third-party libraries, loaded as globals:
         KaTeX renders LaTeX, marked turns Markdown into HTML, DOMPurify removes unsafe HTML. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="#/" aria-label="MathLens home">
        <svg class="logo-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <rect width="32" height="32" rx="8" class="logo-tile" />
          <circle cx="14" cy="14" r="8" fill="none" class="logo-ring" stroke-width="2.4" />
          <path d="M8.5 15.5c2-4.5 3.8-4.5 5.5 0s3.5 4.5 5.5 0" fill="none" class="logo-wave" stroke-width="2.2" stroke-linecap="round" />
          <path d="m20 20 6 6" class="logo-ring" stroke-width="2.8" stroke-linecap="round" />
        </svg>
        <span class="logo-text">Math<em>Lens</em></span>
      </a>
      <nav class="topnav" id="topnav" aria-label="Main">
        <a href="#/" data-path="/">Explore</a>
        <a href="#/graph" data-path="/graph">Graph Lab</a>
        <a href="#/ask" data-path="/ask">Ask</a>
        <a href="#/notebook" data-path="/notebook">Notebook</a>
      </nav>
      <button class="search-trigger" id="search-trigger" type="button" aria-label="Search topics or ask a question">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
        <span class="search-text">Search or ask</span>
        <kbd>/</kbd>
      </button>
      <div class="account-bar" id="account-bar"></div>
      <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch between paper and chalkboard theme" title="Paper / chalkboard">
        <svg class="icon-moon" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7Z" /></svg>
        <svg class="icon-sun" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="3.6" /><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4" /></svg>
      </button>
    </header>

    <main class="view" id="view"></main>
    <footer class="site-footer">
      <nav aria-label="Policies">
        <a href="/about">About</a><a href="/pricing">Pricing</a><a href="/contact">Contact</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refunds">Refunds</a><a href="/delivery">Delivery</a>
      </nav>
      <p>Learn math one step at a time.</p>
    </footer>
  </body>
</html>
